name: eng-agilium

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eng-agilium-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - eng_agilium_mssql_data:/var/opt/mssql
    restart: unless-stopped

  be:
    build:
      context: ./Agilium.Be
      dockerfile: Dockerfile
    container_name: eng-agilium-be
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=${DB_NAME:-eng-agilium-db};User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      AppSettings__FrontendBaseUrl: "http://localhost:${FE_PORT:-5173}"
      AppSettings__Email__Smtp__Host: "${SMTP_HOST:-mailpit}"
      AppSettings__Email__Smtp__Port: "${SMTP_PORT:-1025}"
      AppSettings__Email__Smtp__Username: "${SMTP_USERNAME:-}"
      AppSettings__Email__Smtp__Password: "${SMTP_PASSWORD:-}"
      AppSettings__Email__DebugRecipient: "${SMTP_DEBUG_RECIPIENT:-}"
      AppSettings__Security__Turnstile__Enabled: "${TURNSTILE_ENABLED:-false}"
      AppSettings__Security__Turnstile__SecretKey: "${TURNSTILE_SECRET_KEY:-}"
      AppSettings__Security__Turnstile__SiteKey: "${TURNSTILE_SITE_KEY:-}"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-false}"
    ports:
      - "${BE_PORT:-5049}:8080"
    depends_on:
      - db
      - mailpit
    restart: unless-stopped

  # Local mail catcher: every e-mail the BE sends in development ends up here (http://localhost:8025).
  mailpit:
    image: axllent/mailpit:latest
    container_name: eng-agilium-mailpit
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

  fe:
    build:
      context: ./Agilium.Fe
      dockerfile: Dockerfile
    container_name: eng-agilium-fe
    environment:
      # The browser calls the BE through the port published on the host.
      VITE_API_URL: "http://localhost:${BE_PORT:-5049}/api/v1"
      # Explicit switch (the same TURNSTILE_ENABLED as on the BE); with true and no site key the FE fails loudly.
      VITE_TURNSTILE_ENABLED: "${TURNSTILE_ENABLED:-false}"
      VITE_TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
    ports:
      - "${FE_PORT:-5173}:5173"
    depends_on:
      - be
    restart: unless-stopped

volumes:
  eng_agilium_mssql_data:
